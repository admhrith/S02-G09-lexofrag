<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0001cf" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="LexoFrag" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="images/logo.png" type="image/png" />
  <link rel="apple-touch-icon" href="images/icon-192.png" />
  <title>Orders — LexoFrag Ops</title>
  <!-- Hide Ops pages until the sign-in check passes (no flash of protected content) -->
  <script>document.documentElement.classList.add("auth-pending");</script>
  <style>html.auth-pending body { visibility: hidden; }</style>
  <noscript><style>html.auth-pending body { visibility: visible; }</style></noscript>
  <!-- Tailwind CSS v4 Play CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>
    body {
      background-color: #f8fafc;
      color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #reader video {
      border-radius: 0.75rem;
      object-fit: cover;
      width: 100% !important;
    }
  </style>
  <!-- Byredo-inspired theme (unlayered, overrides Tailwind utilities) -->
  <link rel="stylesheet" href="byredo-theme.css" />
</head>
<body class="min-h-screen flex flex-col bg-slate-50 text-slate-900" data-page="orders">

  <!-- Ops workspace. The header and the Stock Audit / Orders nav are injected by js/layout.js -->
  <div id="app-view" class="flex flex-1 flex-col">
    <main class="flex-1 max-w-6xl w-full mx-auto p-4 sm:p-6 space-y-6">


        <section class="grid grid-cols-3 gap-3 sm:gap-4">
          <div class="bg-white border border-slate-200 rounded-xl p-3.5 sm:p-4 shadow-2xs">
            <span class="text-[11px] font-medium text-slate-500 block">Open Orders</span>
            <span id="stat-open" class="text-xl sm:text-2xl font-bold text-slate-900 mt-0.5 block">0</span>
          </div>
          <div class="bg-white border border-slate-200 rounded-xl p-3.5 sm:p-4 shadow-2xs">
            <span class="text-[11px] font-medium text-slate-500 block">Orders (excl. cancelled)</span>
            <span id="stat-orders" class="text-xl sm:text-2xl font-bold text-slate-900 mt-0.5 block">0</span>
          </div>
          <div class="bg-white border border-slate-200 rounded-xl p-3.5 sm:p-4 shadow-2xs">
            <span class="text-[11px] font-medium text-slate-500 block">Sales Value</span>
            <span id="stat-sales" class="text-xl sm:text-2xl font-bold text-slate-900 mt-0.5 block">RM 0.00</span>
          </div>
        </section>

        <div id="order-feedback" class="hidden"></div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">

          <section id="new-order-card" class="lg:col-span-5 bg-white border border-slate-200 rounded-2xl p-4 sm:p-5 shadow-2xs self-start">
            <span class="text-[11px] font-mono font-semibold uppercase tracking-wider text-blue-600">Orders • New</span>
            <h2 class="text-base sm:text-lg font-bold text-slate-900 mb-3">Capture Customer Order</h2>

            <form onsubmit="handlePlaceOrder(event)" class="space-y-3.5">
              <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Customer Name</label>
                <input id="order-customer" type="text" required placeholder="e.g. Aina" class="w-full px-3 py-2 rounded-xl border border-slate-300 text-sm" />
              </div>
              <div class="grid grid-cols-2 gap-3">
                <div>
                  <label class="block text-xs font-semibold text-slate-700 mb-1">Phone / WhatsApp</label>
                  <input id="order-phone" type="text" placeholder="e.g. 012-345 6789" class="w-full px-3 py-2 rounded-xl border border-slate-300 text-sm" />
                </div>
                <div>
                  <label class="block text-xs font-semibold text-slate-700 mb-1">Sales Channel</label>
                  <select id="order-channel" required class="w-full px-3 py-2 rounded-xl border border-slate-300 text-sm">
                    <option>TikTok Shop</option><option>COD</option><option>Direct Message</option><option>Website</option>
                  </select>
                </div>
              </div>
              <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Delivery Address</label>
                <input id="order-address" type="text" placeholder="Street, area, postcode" class="w-full px-3 py-2 rounded-xl border border-slate-300 text-sm" />
              </div>
              <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Notes</label>
                <input id="order-notes" type="text" placeholder="Optional" class="w-full px-3 py-2 rounded-xl border border-slate-300 text-sm" />
              </div>

              <div class="pt-3 border-t border-slate-200">
                <label class="block text-xs font-semibold text-slate-700 mb-1.5">Items</label>
                <div class="flex gap-2 items-end">
                  <select id="order-sku-select" class="flex-1 min-w-0 px-3 py-2 rounded-xl border border-slate-300 text-sm"></select>
                  <input id="order-qty" type="number" min="1" value="1" aria-label="Quantity" class="w-14 text-center px-1 py-2 rounded-xl border border-slate-300 text-sm" />
                  <button type="button" onclick="addOrderLine()" class="btn btn-ghost">Add</button>
                </div>
                <div class="flex flex-wrap gap-1.5 mt-2.5">
                  <button type="button" onclick="addCombo(10)" class="btn btn-ghost btn-sm">+ Combo 3 Scent (10ml)</button>
                  <button type="button" onclick="addCombo(50)" class="btn btn-ghost btn-sm">+ Combo 3pcs (50ml)</button>
                </div>
                <ul id="order-lines" class="mt-2"></ul>
                <div class="flex items-center justify-between pt-3">
                  <span class="text-xs font-semibold text-slate-700">Order Total</span>
                  <span id="order-total" class="text-lg font-bold text-slate-900">RM 0.00</span>
                </div>
              </div>

              <button type="submit" class="btn btn-primary w-full">Place Order &amp; Deduct Stock</button>
            </form>
          </section>

          <section id="orders-list-card" class="lg:col-span-7 bg-white border border-slate-200 rounded-2xl p-4 sm:p-5 shadow-2xs self-start">
            <div class="flex items-center justify-between gap-2 mb-3">
              <h3 class="text-sm font-bold text-slate-900">Order Book</h3>
              <button type="button" onclick="loadOrders()" class="btn btn-ghost btn-sm">Refresh</button>
            </div>
            <div id="order-filters" class="flex flex-wrap gap-1.5 mb-3"></div>
            <ul id="orders-list" class="space-y-3"></ul>
          </section>
        </div>

    </main>
  </div>


  <script src="js/common.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/orders.js"></script>
</body>
</html>
